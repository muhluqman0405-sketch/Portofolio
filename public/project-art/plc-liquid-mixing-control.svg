<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142b3a" />
      <stop offset="1" stop-color="#0a1722" />
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#43c7d7" stop-opacity=".64" />
      <stop offset="1" stop-color="#237d9b" stop-opacity=".28" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#77a2b2" stroke-opacity=".08" />
    </pattern>
  </defs>
  <rect width="960" height="560" rx="18" fill="#0b1926" />
