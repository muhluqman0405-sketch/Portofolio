  <text x="914" y="50" fill="#6dd9e4" font-family="monospace" font-size="14" text-anchor="end">PLC / MIX / HEAT</text>

  <!-- Feed tank -->
  <path d="M92 205H228V375H92z" fill="url(#panel)" stroke="#77afbc" stroke-opacity=".62" stroke-width="3" />
